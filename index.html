<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本善教育 Benshine Education | 元朗補習中心</title>
<meta name="description" content="本善教育扎根元朗，提供小學及中學中英數專科拔尖/補底課程、新來港支援課程及 STEAM 課程。我們是導孩子向善的引路者。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6EF;
    --bg-alt: #F1EADD;
    --ink: #2C2C2C;
    --pine: #1F3A2E;
    --pine-light: #2E5240;
    --amber: #D98E4A;
    --amber-deep: #BF7530;
    --brown: #8B6F47;
    --line: rgba(31,58,46,0.14);
    --max: 1120px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.logo,.eyebrow{font-family:'Noto Serif TC', serif;}
  a{color:inherit;}
  img{max-width:100%; display:block;}

  .skip-link{
    position:absolute; left:-999px; top:0;
    background:var(--pine); color:#fff; padding:8px 16px; z-index:2000;
  }
  .skip-link:focus{ left:8px; top:8px; }

  :focus-visible{
    outline:3px solid var(--amber);
    outline-offset:2px;
  }

  header{
    position:sticky; top:0; z-index:1000;
    background:rgba(250,246,239,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-container{
    max-width:var(--max); margin:0 auto;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 24px;
  }
  .logo{
    font-size:22px; font-weight:700; color:var(--pine);
    text-decoration:none; letter-spacing:0.5px;
  }
  .logo span{ color:var(--amber-deep); }
  nav{ display:flex; gap:32px; align-items:center; }
  nav a{
    text-decoration:none; color:var(--ink); font-weight:500; font-size:15px;
    position:relative; padding:4px 0;
  }
  nav a::after{
    content:''; position:absolute; left:0; bottom:-2px; width:0; height:2px;
    background:var(--amber); transition:width 0.25s ease;
  }
  nav a:hover::after, nav a:focus-visible::after{ width:100%; }
  .nav-cta{
    background:var(--pine); color:#fff !important; padding:9px 20px;
    border-radius:999px; font-size:14px;
  }
  .nav-cta::after{ display:none; }
  .nav-cta:hover{ background:var(--pine-light); }
  .menu-toggle{ display:none; background:none; border:none; font-size:26px; color:var(--pine); cursor:pointer; }

  .hero{
    position:relative;
    min-height:78vh;
    display:flex; align-items:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 85% 20%, rgba(217,142,74,0.18), transparent 45%),
      linear-gradient(180deg, #233F30 0%, #1B3327 100%);
    color:#FAF6EF;
  }
  .hero::before{
    content:'';
    position:absolute; right:-10%; top:-20%;
    width:600px; height:600px;
    border-radius:50%;
    border:1px solid rgba(217,142,74,0.25);
  }
  .hero::after{
    content:'';
    position:absolute; right:6%; top:8%;
    width:340px; height:340px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(217,142,74,0.35), transparent 70%);
  }
  .hero-inner{
    position:relative; z-index:2;
    max-width:var(--max); margin:0 auto; padding:0 24px;
    width:100%;
  }
  .eyebrow{
    display:inline-block; font-size:14px; letter-spacing:3px;
    color:var(--amber); margin-bottom:18px; font-weight:500;
  }
  .hero h1{
    font-size:clamp(34px, 5vw, 56px);
    line-height:1.3; margin:0 0 14px; font
